services:
  # NestJS Backend
  backend_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookify_backend
    env_file:
      - ./backend/.env
    environment:
      - CI=true
      - DB_HOST=mysql_db
      - REDIS_HOST=redis_cache
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./storage/uploads:/storage/uploads
    depends_on:
      - mysql_db
      - redis_cache

  frontend_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookify_frontend
    env_file:
      - ./frontend/.env
    environment:
      - CI=true
    depends_on:
      - backend_app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - next_cache:/app/.next

  nginx:
    image: nginx:alpine
    container_name: bookify_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/uploads:/storage/uploads:ro
    depends_on:
      - backend_app
      - frontend_app

  mysql_db:
    image: mysql:8.0
    container_name: bookify_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis_cache:
    image: redis:alpine
    container_name: bookify_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "8001:8001"
    environment:
      - RI_APP_HOST=0.0.0.0
      - RI_APP_PORT=8001
    depends_on:
      - redis_cache
    volumes:
      - redis_insight_data:/data

volumes:
  mysql_data:
  redis_data:
  redis_insight_data:
  next_cache:
  backend_node_modules:
  frontend_node_modules:
