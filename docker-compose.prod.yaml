name: bookify-prod

services:
  backend_app:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    user: "node"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ./backend/.env.prod
    environment:
      NODE_ENV: production
      CI: "true"
      MYSQL_HOST: mysql_db
      REDIS_HOST: redis_cache
    volumes:
      - ./storage/uploads:/storage/uploads
    depends_on:
      - mysql_db
      - redis_cache
    restart: unless-stopped

  frontend_app:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    user: "node"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          mode: 1777
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: production
      CI: "true"
      API_INTERNAL_URL: http://backend_app:3000/api
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    depends_on:
      - backend_app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/uploads:/storage/uploads:ro
    depends_on:
      - backend_app
      - frontend_app
    restart: unless-stopped

  mysql_db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis_cache:
    image: redis:alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  mysql_data:
    name: bookify-ecommerce-bookstore_mysql_data
  redis_data:
    name: bookify-ecommerce-bookstore_redis_data
