worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
  error_log /var/log/nginx/error.log warn;
  
  # Rate limit zones
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=100r/s;

  upstream backend_upstream {
    least_conn;
    server backend_app:3000;
    keepalive 256;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  
  server {
    listen 80;
    server_name _;
    client_max_body_size 20M;
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Deny access from /public/
    location ~* ^/public/ {
      deny all;
      return 404;
    }

    # Deny all undeclared path (.dot file, sensitive path)
    location ~ /\. {
      deny all;
      return 404;
    }

    location ^~ /uploads/ {
      alias /storage/uploads/;
      add_header X-Content-Type-Options "nosniff" always;
      default_type application/octet-stream;
    }

    # Next.js dev assets: never cache to avoid hydration mismatch
    location ^~ /_next/ {
      proxy_pass http://frontend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      expires off;
      access_log off;
    }

    # Static file (exclude css/js to avoid stale dev bundles)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
      proxy_pass http://frontend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      expires 7d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Backend
    location /api {
      limit_req zone=api_limit burst=50 nodelay;
      limit_req_status 429;
      
      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_cache off;
    }

    # Frontend
    location / {
      limit_req zone=frontend_limit burst=200 nodelay;
      limit_req_status 429;

      proxy_pass http://frontend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }

  }
}
