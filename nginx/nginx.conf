events {}

http {
  access_log off;
  error_log /var/log/nginx/error.log warn;
  
  # Rate limit zone
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
  
  server {
    listen 80;
    client_max_body_size 20M;
    server_tokens off;

    # Deny access from /public/
    location ~* ^/public/ {
      deny all;
      return 404;
    }

    # Deny all undeclared path (.dot file, sensitive path)
    location ~ /\. {
      deny all;
      return 404;
    }

    # Next.js dev assets: never cache to avoid hydration mismatch
    location ^~ /_next/ {
      proxy_pass http://frontend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      expires off;
      access_log off;
    }

    # Static file (exclude css/js to avoid stale dev bundles)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
      proxy_pass http://frontend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      expires 7d;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Backend
    location /api {
      limit_req zone=api_limit burst=50 nodelay;
      limit_req_status 429;

      proxy_pass http://backend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend
    location / {
      proxy_pass http://frontend_app:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location ^~ /uploads/ {
      alias /storage/uploads/;
    }
  }
}